name: "Blackout: make signing key (run once)"

on:
  workflow_dispatch:

jobs:
  make-key:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create signing key
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          EXISTING_KEY: ${{ secrets.SIGNING_KEY_B64 }}
        run: |
          if [ -n "$EXISTING_KEY" ]; then
            echo "A signing key already exists (SIGNING_KEY_B64). Not creating another one."
            exit 1
          fi
          if [ ${#SIGNING_PASSWORD} -lt 16 ]; then
            echo "Add a SIGNING_PASSWORD secret of at least 16 characters first."
            exit 1
          fi
          mkdir key
          keytool -genkeypair -storetype PKCS12 -keystore key/blackout.p12 \
            -alias blackout -keyalg RSA -keysize 4096 -validity 36500 \
            -dname "CN=Blackout launcher personal build" \
            -storepass:env SIGNING_PASSWORD -keypass:env SIGNING_PASSWORD
          base64 -w0 key/blackout.p12 > key/SIGNING_KEY_B64.txt
          echo "Key created. Download the 'signing-key' artifact, copy SIGNING_KEY_B64.txt into a secret, then delete the artifact."

      - uses: actions/upload-artifact@v4
        with:
          name: signing-key
          path: key/
          retention-days: 1
